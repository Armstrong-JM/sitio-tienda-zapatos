<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Zapatos formales</title>
</head>
<body>
    <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {   background-color: #fffbea;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Tarjetas */
    .card {
      border: none;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Colores */
    .navbar, footer {
      background: linear-gradient(90deg, #ffb347, #ffcc33);
    }
    .btn-custom {
      background-color: #ff9900;
      color: white;
    }
    .btn-custom:hover {
      background-color: #e68a00;
      color: white;
    }

    /* Modo oscuro */
    .dark-mode {
      background-color: #1a1a1a !important;
      color: #f1f1f1 !important;
    }
    .dark-mode .navbar, 
    .dark-mode footer {
      background: linear-gradient(90deg, #333, #555);
    }
    .dark-mode .card {
      background-color: #2c2c2c;
      color: #f1f1f1;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <img src="img/KZ.jpeg" alt="logo" width="40" height="40" class="me-2">
        Zapatería KAIZEN
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#productos">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#categorias">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="#testimonios">Testimonios</a></li>
          <li class="nav-item"><a class="nav-link" href="#contacto">Sobre nosotros</a></li>
        </ul>
        <button id="modoBtn" class="btn btn-sm btn-outline-dark ms-3">🌙 Modo oscuro</button>
      </div>
    </div>
  </nav>


</body>
<!-- Pie de página -->
  <footer class="text-dark py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">© 2025 Zapatería KAIZEN</p>
      <div>

</html>
